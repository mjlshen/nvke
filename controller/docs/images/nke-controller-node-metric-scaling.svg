<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc">
  <title id="title">Node- and metric-driven scaling</title>
  <desc id="desc">Two plots compare synthetic estimates with live CAPD measurements for goroutines as node count grows and Prometheus latency as emitted series grow.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252A; }
    .figure-title { font-size: 30px; font-weight: 600; }
    .legend { font-size: 18px; font-weight: 600; }
    .panel-title { font-size: 24px; font-weight: 600; }
    .panel-subtitle, .annotation, .footer { font-size: 16px; fill: #57606A; }
    .tick { font-size: 16px; fill: #57606A; }
    .axis-title, .series-label { font-size: 17px; font-weight: 600; }
    .frame { fill: #FFFFFF; stroke: #687078; stroke-width: 1.5; }
    .grid { stroke: #D8DEE4; stroke-width: 1; }
    .tick-mark { stroke: #687078; stroke-width: 1.5; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <text class="figure-title" x="70" y="52">Node- and metric-driven scaling</text>
  <line x1="720" y1="44" x2="766" y2="44" stroke="#0072B2" stroke-width="5" stroke-dasharray="9 7" />
  <text class="legend" x="780" y="51">Synthetic</text>
  <line x1="930" y1="44" x2="976" y2="44" stroke="#D55E00" stroke-width="5" />
  <text class="legend" x="990" y="51">Live CAPD</text>
  <text class="panel-title" x="120" y="95">Persistent concurrency at 20 clusters</text>
<text class="panel-subtitle" x="120" y="120">Worker count changes transient work, but not the number of per-cluster clients and watches.</text>
<rect class="frame" x="120" y="145" width="1010" height="215" />
<line class="grid" x1="120" y1="360.0" x2="1130" y2="360.0" />
<text class="tick" x="106" y="365.0" text-anchor="end">1,000</text>
<line class="grid" x1="120" y1="306.3" x2="1130" y2="306.3" />
<text class="tick" x="106" y="311.3" text-anchor="end">1,200</text>
<line class="grid" x1="120" y1="252.5" x2="1130" y2="252.5" />
<text class="tick" x="106" y="257.5" text-anchor="end">1,400</text>
<line class="grid" x1="120" y1="198.8" x2="1130" y2="198.8" />
<text class="tick" x="106" y="203.8" text-anchor="end">1,600</text>
<line class="grid" x1="120" y1="145.0" x2="1130" y2="145.0" />
<text class="tick" x="106" y="150.0" text-anchor="end">1,800</text>
<line class="tick-mark" x1="120.0" y1="360" x2="120.0" y2="367" />
<text class="tick" x="120.0" y="388" text-anchor="middle">20</text>
<line class="tick-mark" x1="372.5" y1="360" x2="372.5" y2="367" />
<text class="tick" x="372.5" y="388" text-anchor="middle">40</text>
<line class="tick-mark" x1="625.0" y1="360" x2="625.0" y2="367" />
<text class="tick" x="625.0" y="388" text-anchor="middle">60</text>
<line class="tick-mark" x1="877.5" y1="360" x2="877.5" y2="367" />
<text class="tick" x="877.5" y="388" text-anchor="middle">80</text>
<line class="tick-mark" x1="1130.0" y1="360" x2="1130.0" y2="367" />
<text class="tick" x="1130.0" y="388" text-anchor="middle">100</text>
<text class="axis-title" x="625" y="415" text-anchor="middle">Total nodes at 20 clusters</text>
<text class="axis-title" transform="translate(50 252) rotate(-90)" text-anchor="middle">Goroutines</text>
<polyline points="120.0,337.4 1130.0,337.4" fill="none" stroke="#0072B2" stroke-width="4" stroke-dasharray="9 7" />
<circle cx="120.0" cy="337.4" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<circle cx="1130.0" cy="337.4" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<text class="series-label" fill="#0072B2" x="1118.0" y="325.4" text-anchor="end">Synthetic: 54/cluster + 4</text>
<polyline points="120.0,182.1 372.5,200.4 1130.0,200.6" fill="none" stroke="#D55E00" stroke-width="4" />
<circle cx="120.0" cy="182.1" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="372.5" cy="200.4" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="1130.0" cy="200.6" r="7" fill="#FFFFFF" stroke="#D55E00" stroke-width="4" />
<text class="series-label" fill="#D55E00" x="1118.0" y="188.6" text-anchor="end">Live measured</text>
<text class="annotation" x="1125.0" y="226.6" text-anchor="end">post-restart</text>
<text class="panel-title" x="120" y="455">Prometheus latency follows emitted series</text>
<text class="panel-subtitle" x="120" y="480">The incomplete 100-node recovery scrape is isolated rather than treated as a scaling improvement.</text>
<rect class="frame" x="120" y="505" width="1010" height="225" />
<line class="grid" x1="120" y1="730.0" x2="1130" y2="730.0" />
<text class="tick" x="106" y="735.0" text-anchor="end">5</text>
<line class="grid" x1="120" y1="697.4" x2="1130" y2="697.4" />
<text class="tick" x="106" y="702.4" text-anchor="end">10</text>
<line class="grid" x1="120" y1="645.8" x2="1130" y2="645.8" />
<text class="tick" x="106" y="650.8" text-anchor="end">30</text>
<line class="grid" x1="120" y1="589.2" x2="1130" y2="589.2" />
<text class="tick" x="106" y="594.2" text-anchor="end">100</text>
<line class="grid" x1="120" y1="537.6" x2="1130" y2="537.6" />
<text class="tick" x="106" y="542.6" text-anchor="end">300</text>
<line class="tick-mark" x1="120.0" y1="730" x2="120.0" y2="737" />
<text class="tick" x="120.0" y="758" text-anchor="middle">2k</text>
<line class="tick-mark" x1="346.0" y1="730" x2="346.0" y2="737" />
<text class="tick" x="346.0" y="758" text-anchor="middle">5k</text>
<line class="tick-mark" x1="517.0" y1="730" x2="517.0" y2="737" />
<text class="tick" x="517.0" y="758" text-anchor="middle">10k</text>
<line class="tick-mark" x1="1085.0" y1="730" x2="1085.0" y2="737" />
<text class="tick" x="1085.0" y="758" text-anchor="middle">100k</text>
<text class="axis-title" x="625" y="785" text-anchor="middle">Emitted Prometheus samples</text>
<text class="axis-title" transform="translate(50 617) rotate(-90)" text-anchor="middle">Median scrape latency (ms)</text>
<polyline points="367.7,712.9 1085.3,520.1" fill="none" stroke="#0072B2" stroke-width="4" stroke-dasharray="9 7" />
<circle cx="367.7" cy="712.9" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<circle cx="1085.3" cy="520.1" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<text class="series-label" fill="#0072B2" x="1073.3" y="506.1" text-anchor="end">Synthetic projection</text>
<polyline points="367.7,712.9 385.0,697.0 416.8,692.1 451.1,677.7 512.5,676.8" fill="none" stroke="#D55E00" stroke-width="4" />
<circle cx="367.7" cy="712.9" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="385.0" cy="697.0" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="416.8" cy="692.1" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="451.1" cy="677.7" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="512.5" cy="676.8" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<text class="series-label" fill="#D55E00" x="524.5" y="664.8" text-anchor="start">Live complete scrapes</text>
<circle cx="163.0" cy="688.1" r="7" fill="#FFFFFF" stroke="#D55E00" stroke-width="4" />
<text class="annotation" x="177.0" y="676.1" text-anchor="start">2,381 samples after restart</text>
<text class="annotation" x="1075.3" y="544.1" text-anchor="end">measured synthetic dense fixture</text>
  <text class="footer" x="70" y="803">Hollow points are qualified post-restart measurements. Prometheus axes are logarithmic.</text>
</svg>
