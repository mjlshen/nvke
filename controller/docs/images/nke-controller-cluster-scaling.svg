<line class="tick-mark" x1="221.0" y1="1040" x2="221.0" y2="1047" />
<text class="tick" x="221.0" y="1068" text-anchor="middle">10</text>
<line class="tick-mark" x1="625.0" y1="1040" x2="625.0" y2="1047" />
<text class="tick" x="625.0" y="1068" text-anchor="middle">50</text>
<line class="tick-mark" x1="1130.0" y1="1040" x2="1130.0" y2="1047" />
<text class="tick" x="1130.0" y="1068" text-anchor="middle">100</text>
<text class="axis-title" x="625" y="1095" text-anchor="middle">Tenant clusters</text>
<text class="axis-title" transform="translate(50 932) rotate(-90)" text-anchor="middle">Connections / backends</text>
<polyline points="120.0,1034.6 221.0,980.9 625.0,868.0 1130.0,868.0" fill="none" stroke="#0072B2" stroke-width="4" stroke-dasharray="9 7" />
<circle cx="120.0" cy="1034.6" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<circle cx="221.0" cy="980.9" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<circle cx="625.0" cy="868.0" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<circle cx="1130.0" cy="868.0" r="7" fill="#0072B2" stroke="#0072B2" stroke-width="4" />
<text class="series-label" fill="#0072B2" x="1118.0" y="856.0" text-anchor="end">Synthetic demand model</text>
<polyline points="120.0,954.0 170.5,954.0 221.0,954.0 322.0,954.0" fill="none" stroke="#D55E00" stroke-width="4" />
<circle cx="120.0" cy="954.0" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="170.5" cy="954.0" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="221.0" cy="954.0" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="322.0" cy="954.0" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<text class="series-label" fill="#D55E00" x="334.0" y="978.0" text-anchor="start">Live full-stack backends</text>
<circle cx="322.0" cy="911.0" r="7" fill="#D55E00" stroke="#D55E00" stroke-width="4" />
<circle cx="322.0" cy="937.9" r="7" fill="#FFFFFF" stroke="#D55E00" stroke-width="4" />
<text class="annotation" x="625.0" y="892.0" text-anchor="middle">~19.7k pool waits</text>
<text class="annotation" x="1125.0" y="892.0" text-anchor="end">~19.9k waits</text>
<text class="annotation" x="336.0" y="903.0" text-anchor="start">40 nodes</text>
<text class="annotation" x="336.0" y="929.9" text-anchor="start">100 nodes, post-restart</text>
  <text class="footer" x="70" y="1113">Dashed lines are modeled estimates. Live PostgreSQL values are pg_stat_database backends; synthetic waits are measured.</text>
</svg>
